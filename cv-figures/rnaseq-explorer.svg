<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative RNA-seq explorer mockup</title>
  <desc id="desc">A fictional dashboard showing a volcano-style scatter plot and gene expression heatmap.</desc>
  <rect width="900" height="500" rx="18" fill="#f3f7f7"/>
  <rect x="18" y="18" width="864" height="464" rx="12" fill="#fff" stroke="#dce4e8"/>
  <rect x="18" y="18" width="864" height="54" rx="12" fill="#eaf1f2"/>
  <circle cx="43" cy="45" r="7" fill="#087e8b"/><circle cx="66" cy="45" r="7" fill="#7eb3b5"/><circle cx="89" cy="45" r="7" fill="#c7d7d9"/>
  <text x="120" y="51" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#202b36">RNA-seq explorer</text>
  <rect x="38" y="96" width="824" height="48" rx="7" fill="#f3f7f7"/>
  <text x="57" y="126" font-family="Arial,sans-serif" font-size="13" fill="#647383">Contrast</text><rect x="118" y="106" width="190" height="30" rx="4" fill="#fff" stroke="#cbd7db"/><text x="130" y="126" font-family="Arial,sans-serif" font-size="12" fill="#647383">Treatment vs control</text>
  <text x="344" y="126" font-family="Arial,sans-serif" font-size="13" fill="#647383">FDR threshold</text><rect x="438" y="106" width="90" height="30" rx="4" fill="#fff" stroke="#cbd7db"/><text x="456" y="126" font-family="Arial,sans-serif" font-size="12" fill="#647383">0.05</text>
  <text x="64" y="181" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#202b36">Differential expression</text>
