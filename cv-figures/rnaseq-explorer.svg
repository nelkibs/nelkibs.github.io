    <rect x="560" y="356" width="43" height="32" fill="#3d7890"/><rect x="605" y="356" width="43" height="32" fill="#7daaa3"/><rect x="650" y="356" width="43" height="32" fill="#c6bd81"/><rect x="695" y="356" width="43" height="32" fill="#d48a6c"/><rect x="740" y="356" width="43" height="32" fill="#b85d5c"/>
