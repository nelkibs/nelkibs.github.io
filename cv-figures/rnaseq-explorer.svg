  <text x="229" y="419" font-family="Arial,sans-serif" font-size="11" fill="#647383">log₂ fold change</text>
  <text x="69" y="310" transform="rotate(-90 69 310)" font-family="Arial,sans-serif" font-size="11" fill="#647383">−log₁₀ adjusted p</text>
