  <line x1="95" y1="396" x2="440" y2="396" stroke="#9eacb3"/><line x1="95" y1="396" x2="95" y2="220" stroke="#9eacb3"/>
  <line x1="95" y1="307" x2="440" y2="307" stroke="#dce4e8" stroke-dasharray="4 4"/>
